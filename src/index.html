    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "什么是滑块验证码？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "滑块验证码是一种人机验证方式，用户通过拖动滑块完成拼图来证明自己是真人，而非自动化脚本。相比传统字符验证码，滑块验证码用户体验更好、安全性更高。"
          }
        },
        {
          "@type": "Question",
          "name": "Waterproof Wall 的 HMAC 签名验票是什么？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "HMAC 签名验票是指后端在验证 ticket 时，前端需使用 App Secret 对请求进行 HMAC-SHA256 签名，服务端校验签名后才能通过。这确保了 ticket 无法被伪造或重放。"
          }
        },
        {
          "@type": "Question",
          "name": "如何接入 Waterproof Wall 验证码？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "只需两步：1. 前端引入 SDK（一行 script 标签），调用 SliderCaptcha 的 verify 方法获取 ticket；2. 后端使用 App Key 和 App Secret 对请求进行 HMAC-SHA256 签名，调用验票接口验证 ticket 有效性。"
          }
        },
        {
          "@type": "Question",
          "name": "Waterproof Wall 支持多租户吗？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "支持。每个应用独立分配 appId、appKey 和 appSecret，数据完全隔离，互不影响。可在同一平台上为不同业务创建多个应用。"
          }
        },
        {
          "@type": "Question",
          "name": "滑块验证码能防止哪些攻击？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Waterproof Wall 滑块验证码可防止：自动化脚本批量注册、暴力破解登录、恶意抢购薅羊毛、爬虫恶意抓取等。同时通过行为轨迹分析（滑动速度、加速度）精准区分人机。"
          }
        },
        {
          "@type": "Question",
          "name": "Waterproof Wall 是开源的吗？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "是的，Waterproof Wall 是开源滑块验证码平台。前端使用 Vue 3 + Vite，后端使用 Go，支持自部署。"
          }
        }
      ]
    }
